name: unit tests

on:
  push:
    branches: ['master']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.11']   # pinned: last version with verified package compat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository layout
        run: |
          set -euo pipefail
          for f in func.jl nfds.jl model.jl preprocess--mass.jl; do
            test -f "src/$f" || { echo "::error::src/$f is missing"; exit 1; }
            n=$(find . -name "$f" -not -path './.git/*' | wc -l)
            test "$n" -eq 1 || { echo "::error::$f must exist only in src/ (found $n copies)"; exit 1; }
          done
          for d in tests raw; do
            test -d "$d" || { echo "::error::$d/ is missing"; exit 1; }
          done
          test -f "src/Project.toml"      || { echo "::error::src/Project.toml missing"; exit 1; }
          test -f "tests/runtests.jl"     || { echo "::error::tests/runtests.jl missing"; exit 1; }
          echo "layout OK"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v1
        # v1 auto-generates the cache key from Project.toml; no inputs needed.

      - name: Install Julia packages
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=src -e 'using Pkg; Pkg.instantiate()'

      - name: Syntax check
        # Parses each file's AST without executing it.
        # Key fix: earlier version used `$src` in a bash double-quoted string,
        # which bash expanded as an empty variable before Julia ever ran.
        # Now: bash only expands $f (the loop variable); Julia sees no $ at all.
        # Meta.parseall throws ParseError on any syntax mistake.
        run: |
          set -euo pipefail
          for f in src/func.jl src/nfds.jl src/model.jl src/preprocess--mass.jl; do
            julia --startup-file=no -e "
              code = read(\"$f\", String)
              Meta.parseall(code)
              println(\"parse OK  $f\")
            " || { echo "::error::Syntax error in $f"; exit 1; }
          done

      - name: Snapshot working tree
        run: |
          find . -path ./.git -prune -o -type f -print0 \
            | sort -z | xargs -0 -r md5sum > /tmp/tree-before.md5

      - name: Run unit tests
        env:
          JULIA_NUM_THREADS: auto
        run: julia --project=src --threads auto tests/runtests.jl

      - name: Working tree must be untouched
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -type f -print0 \
            | sort -z | xargs -0 -r md5sum > /tmp/tree-after.md5
          if ! diff -u /tmp/tree-before.md5 /tmp/tree-after.md5; then
            echo "::error::the test run wrote real repository files"
            exit 1
          fi
          echo "working tree untouched"
