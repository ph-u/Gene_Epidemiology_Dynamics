name: unit tests

on:
  push:
    branches: ['master']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BRREWABC_REF: HEAD          # replace with a commit SHA once it works

jobs:
  unit-tests:
    name: R ${{ matrix.r-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        r-version: ['4.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository layout
        run: |
          set -euo pipefail
          for f in src.r nfds.r model.r; do
            test -f "src/$f" || { echo "::error::src/$f is missing"; exit 1; }
            n=$(find . -name "$f" -not -path './.git/*' | wc -l)
            test "$n" -eq 1 || { echo "::error::$f must exist only in src/ (found $n copies)"; exit 1; }
          done
          for d in tests raw; do
            test -d "$d" || { echo "::error::$d/ is missing"; exit 1; }
          done
          for t in helper-fixture.R test-src.R test-nfds.R test-model.R; do
            test -f "tests/$t" || { echo "::error::tests/$t is missing"; exit 1; }
          done
          ln -s src/model.r /tmp/_symtest && rm /tmp/_symtest
          echo "layout OK"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ matrix.r-version }}-brrewabc-v1
          restore-keys: ${{ runner.os }}-r-${{ matrix.r-version }}-

      - name: Install R packages
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (!requireNamespace("testthat", quietly = TRUE)) install.packages("testthat")
          if (!requireNamespace("remotes",  quietly = TRUE)) install.packages("remotes")
          if (!requireNamespace("BRREWABC", quietly = TRUE))
            remotes::install_github("GaelBn/BRREWABC",
                                    ref     = Sys.getenv("BRREWABC_REF", "HEAD"),
                                    upgrade = "never")
          cat("BRREWABC ", as.character(packageVersion("BRREWABC")), "\n")

      - name: Parse check
        run: |
          set -euo pipefail
          for f in src/src.r src/nfds.r src/model.r; do
            Rscript -e "invisible(parse('$f')); cat('parse OK  $f\n')"
          done

      - name: Snapshot working tree
        run: |
          find . -path ./.git -prune -o -type f -print0 \
            | sort -z | xargs -0 -r md5sum > /tmp/tree-before.md5

      - name: Run unit tests
        env:
          NFDS_SRC: ${{ github.workspace }}/src
        run: Rscript -e 'testthat::test_dir("tests", stop_on_failure = TRUE)'

      - name: Working tree must be untouched
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -type f -print0 \
            | sort -z | xargs -0 -r md5sum > /tmp/tree-after.md5
          if ! diff -u /tmp/tree-before.md5 /tmp/tree-after.md5; then
            echo "::error::the test run read or wrote real repository files"
            exit 1
          fi
          echo "working tree untouched"
