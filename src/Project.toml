# Julia environment for the NFDS model — NOT a registered package.
# name/version/authors are intentionally omitted: those fields are for
# registered packages; including them without a uuid causes Pkg edge-cases.
# All five UUIDs are taken directly from the Julia General registry.

[deps]
CSV           = "336ed68f-0bac-5ca0-87d4-7b16caf5d00b"
DataFrames    = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
JLD2          = "033835bb-8acc-5ee8-8aae-3f567f8a3819"
StatsBase     = "2913bbd2-ae8a-5f71-8c99-4fb6c76f3a91"

# Standard library packages (Random, Statistics, Printf) are always available
# and do not need entries here.

[compat]
CSV           = "0.10"
DataFrames    = "1.6"
Distributions = "0.25"
JLD2          = "0.4"
StatsBase     = "0.34"
julia         = "1.11"
